[package]
name = "dim-ark-connect"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dim-ark = { workspace = true }
dim-lang = { workspace = true }
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"
